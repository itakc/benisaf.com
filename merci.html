<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Message envoyé - Béni Saf</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      color: white;

      background:
        linear-gradient(
          rgba(0, 60, 105, 0.72),
          rgba(0, 40, 75, 0.82)
        ),
        url("vitrine.png");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .confirmation {
      width: 100%;
      max-width: 720px;

      padding: 55px 35px;

      text-align: center;

      border-radius: 28px;

      background: rgba(0, 50, 90, 0.82);

      border: 1px solid rgba(255,255,255,0.35);

      backdrop-filter: blur(12px);

      box-shadow:
        0 20px 55px rgba(0,0,0,0.35);
    }

    .check {
      width: 90px;
      height: 90px;

      margin: 0 auto 25px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #ffffff;

      color: #008acb;

      font-size: 48px;
      font-weight: bold;

      box-shadow:
        0 0 25px rgba(255,255,255,0.35);
    }

    h1 {
      margin-bottom: 18px;

      font-size: 36px;
    }

    p {
      max-width: 560px;

      margin: 0 auto 10px;

      font-size: 17px;
      line-height: 1.6;

      color: #e0f4ff;
    }

    .home-btn {
      display: inline-block;

      margin-top: 30px;

      padding: 14px 30px;

      border: 1px solid white;
      border-radius: 999px;

      color: white;
      text-decoration: none;

      font-size: 16px;
      font-weight: 700;

      background: rgba(0, 120, 190, 0.65);

      transition:
        transform 0.25s ease,
        background 0.25s ease;
    }

    .home-btn:hover {
      transform: translateY(-2px);
      background: rgba(0, 160, 220, 0.85);
    }

    @media (max-width: 600px) {
      .confirmation {
        padding: 40px 22px;
      }

      h1 {
        font-size: 28px;
      }

      p {
        font-size: 15px;
      }

      .check {
        width: 74px;
        height: 74px;
        font-size: 38px;
      }
    }
  </style>
</head>

<body>

  <main class="confirmation">

    <div class="check">
      ✓
    </div>

    <h1>Message envoyé avec succès</h1>

    <p>
      Merci pour votre message.
    </p>

    <p>
      Votre demande a bien été transmise et sera examinée prochainement.
    </p>

    <a href="index.html" class="home-btn">
      Retour à l’accueil
    </a>

  </main>

</body>
</html>
