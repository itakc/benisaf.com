<html lang="fr">
<head>

 <title>Béni Saf – Ville, plages, tourisme et histoire | benisaf.fr</title>

<meta name="description"

  <style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
  }

  html,
  body {
    width: 100%;
    min-height: 100%;
    background: #0c5f92;
    overflow-x: hidden;
  }

  .hero {
  position: relative;
  width: 100%;
}

.hero-img {
  display: block;
  width: 100%;
  height: auto;
}

  .top-nav {
  position: absolute;
  top: 42px;

  left: 280px;
  right: 40px;

  display: flex;
  align-items: center;
  gap: 28px;

  z-index: 10;

  white-space: nowrap;
}

  .nav-link {
    position: relative;

    color: white;
    text-decoration: none;

    font-size: 16px;
    font-weight: 700;

    letter-spacing: 0.5px;

    text-shadow:
      0 2px 6px rgba(0, 0, 0, 0.55);

    transition:
      transform 0.25s ease,
      text-shadow 0.25s ease;
  }

  .nav-link::after {
    content: "";
    position: absolute;

    left: 0;
    bottom: -8px;

    width: 0;
    height: 2px;

    background: white;

    transition: width 0.25s ease;
  }

  .nav-link:hover::after,
  .nav-link.active::after {
    width: 100%;
  }

  .nav-link:hover {
    transform: translateY(-3px);

    text-shadow:
      0 0 10px rgba(255, 255, 255, 0.9),
      0 0 20px rgba(255, 255, 255, 0.5);
  }

  .discover-btn {
    display: inline-flex;
    align-items: center;
    gap: 9px;

    padding: 13px 24px;

    color: white;
    text-decoration: none;

    font-size: 15px;
    font-weight: 700;

    border: 1px solid rgba(255, 255, 255, 0.9);
    border-radius: 999px;

    background: rgba(0, 85, 140, 0.18);

    backdrop-filter: blur(5px);

    box-shadow:
      0 0 12px rgba(255, 255, 255, 0.16);

    transition:
      background 0.25s ease,
      transform 0.25s ease,
      box-shadow 0.25s ease;
  }

  .discover-btn:hover {
    background: rgba(255, 255, 255, 0.18);

    transform: translateY(-3px) scale(1.03);

    box-shadow:
      0 0 20px rgba(255, 255, 255, 0.45);
  }

  .discover-icon {
    font-size: 16px;
  }
    .seo-title{
  position:absolute;
  width:1px;
  height:1px;
  padding:0;
  margin:-1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap;
  border:0;
}

/* ========================= */
/* SAKKSI - AGENT VIRTUEL    */
/* ========================= */

.sakksi-widget{
  position:fixed;
  right:24px;
  bottom:8px;
  z-index:9999;
  font-family:Arial, Helvetica, sans-serif;
}

/* ASSISTANTE HOLOGRAPHIQUE */

.sakksi-avatar-wrap{
  position:relative;
  width:155px;
  height:235px;

  display:flex;
  align-items:flex-end;
  justify-content:center;

  cursor:pointer;

  transition:
    transform .3s ease,
    filter .3s ease;
}

.sakksi-avatar-wrap:hover{
  transform:translateY(-5px) scale(1.03);
}

.sakksi-avatar{
  display:block;

  width:auto !important;
  height:auto !important;

  max-width:155px !important;
  max-height:235px !important;

  object-fit:contain;

  filter:
    drop-shadow(0 0 8px rgba(0,220,255,.80))
    drop-shadow(0 0 24px rgba(0,150,255,.65));
}

.sakksi-glow{
  position:absolute;

  left:50%;
  bottom:2px;

  width:125px;
  height:24px;

  transform:translateX(-50%);

  border-radius:50%;

  background:rgba(0,220,255,.32);

  filter:blur(13px);

  z-index:-1;
}


/* PETITE BULLE "BESOIN D'AIDE" */

.sakksi-hint{
  position:absolute;

  right:165px;
  bottom:42px;

  white-space:nowrap;

  padding:10px 18px;

  border-radius:24px;

  color:#ffffff;

  background:rgba(3,35,66,.72);

  border:
    1px solid rgba(90,220,255,.42);

  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);

  box-shadow:
    0 8px 30px rgba(0,0,0,.28);

  transition:
    opacity .25s ease,
    visibility .25s ease;
}


/* ========================= */
/* FENETRE CHAT              */
/* ========================= */

.sakksi-chat{
  position:absolute;

  right:175px;
  bottom:18px;

  width:470px;

  border-radius:30px;

  overflow:hidden;

  background:
    linear-gradient(
      145deg,
      rgba(4,48,94,.76),
      rgba(3,28,65,.74)
    );

  border:
    1px solid rgba(105,220,255,.48);

  box-shadow:
    0 0 28px rgba(0,200,255,.22),
    0 20px 60px rgba(0,0,0,.42),
    inset 0 0 35px rgba(80,210,255,.05);

  backdrop-filter:
    blur(20px)
    saturate(145%);

  -webkit-backdrop-filter:
    blur(20px)
    saturate(145%);

  opacity:0;
  visibility:hidden;

  transform:
    translateX(20px)
    scale(.96);

  transform-origin:
    bottom right;

  transition:
    opacity .3s ease,
    visibility .3s ease,
    transform .3s ease;
}

.sakksi-chat.open{
  opacity:1;
  visibility:visible;

  transform:
    translateX(0)
    scale(1);
}


/* HEADER */

.sakksi-header{
  display:flex;
  align-items:center;

  padding:22px 25px;

  border-bottom:
    1px solid rgba(100,210,255,.16);

  background:
    linear-gradient(
      90deg,
      rgba(12,74,135,.28),
      rgba(0,180,230,.10)
    );
}

.sakksi-title{
  flex:1;
}

.sakksi-title strong{
  display:block;

  color:#73edff;

  font-size:20px;
  font-weight:800;

  letter-spacing:1.4px;

  text-shadow:
    0 0 12px rgba(0,220,255,.25);
}

.sakksi-close{
  width:40px;
  height:40px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:0;

  border-radius:50%;

  background:transparent;

  color:#e5fbff;

  font-size:30px;
  font-weight:300;

  cursor:pointer;

  transition:.25s ease;
}

.sakksi-close:hover{
  background:rgba(255,255,255,.08);
  transform:rotate(90deg);
}


/* CONTENU */

.sakksi-content{
  padding:20px 24px 24px;
}


/* MESSAGE */

.sakksi-message{
  padding:24px 25px;

  margin-bottom:24px;

  border-radius:23px;

  background:
    linear-gradient(
      145deg,
      rgba(30,105,170,.22),
      rgba(5,48,100,.26)
    );

  border:
    1px solid rgba(95,215,255,.28);

  box-shadow:
    inset 0 0 22px rgba(60,190,255,.04);
}

.sakksi-message p{
  margin:0;

  color:#f6fcff;

  font-size:19px;

  line-height:1.55;
}

.sakksi-message strong{
  color:white;
}


/* BARRE DE SAISIE */

.sakksi-input-row{
  display:flex;
  align-items:center;

  gap:12px;

  width:100%;
}

.sakksi-input{
  flex:1;

  min-width:0;

  height:64px;

  padding:0 20px;

  border-radius:20px;

  border:
    1px solid rgba(80,205,255,.28);

  outline:none;

  background:
    rgba(2,29,61,.72);

  color:white;

  font-family:Arial, Helvetica, sans-serif;

  font-size:18px;

  box-shadow:
    inset 0 0 18px rgba(0,0,0,.18);
}

.sakksi-input::placeholder{
  color:
    rgba(205,230,245,.55);
}

.sakksi-input:focus{
  border-color:
    rgba(75,225,255,.72);

  box-shadow:
    0 0 15px rgba(0,190,255,.17),
    inset 0 0 18px rgba(0,0,0,.15);
}


/* BOUTON ENVOI */

.sakksi-send{
  flex:0 0 68px;

  width:68px;
  height:64px;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:0;

  border:0;

  border-radius:20px;

  background:
    linear-gradient(
      145deg,
      #35c3ff,
      #0aa6e9
    );

  color:white;

  font-size:31px;

  cursor:pointer;

  box-shadow:
    0 0 24px rgba(0,190,255,.30);

  transition:
    transform .25s ease,
    box-shadow .25s ease;
}

.sakksi-send:hover{
  transform:
    translateY(-2px)
    scale(1.03);

  box-shadow:
    0 0 32px rgba(0,205,255,.52);
}


/* MOBILE */

@media(max-width:600px){

  .sakksi-widget{
    right:10px;
    bottom:5px;
  }

  .sakksi-avatar-wrap{
    width:105px;
    height:160px;
  }

  .sakksi-avatar{
    max-width:105px !important;
    max-height:160px !important;
  }

  .sakksi-hint{
    display:none;
  }

  .sakksi-chat{
    position:fixed;

    left:12px;
    right:12px;
    bottom:175px;

    width:auto;

    border-radius:25px;
  }

  .sakksi-header{
    padding:17px 18px;
  }

  .sakksi-title strong{
    font-size:16px;
  }

  .sakksi-content{
    padding:16px;
  }

  .sakksi-message{
    padding:18px;
  }

  .sakksi-message p{
    font-size:16px;
  }

  .sakksi-input{
    height:55px;
    font-size:16px;
  }

  .sakksi-send{
    width:57px;
    height:55px;
    flex-basis:57px;
  }
}

  /* TABLETTE */
  @media (max-width: 1100px) {

    .hero {
      background-image: url("vitrine-tablette.png");
      background-position: center top;
    }

    .top-nav {
      gap: 18px;
    }

    .nav-link {
      font-size: 14px;
    }

    .discover-btn {
      padding: 11px 18px;
      font-size: 14px;
    }
  }

  /* TABLETTE / PETIT ÉCRAN */
  @media (max-width: 850px) {

    .top-nav {
      top: 18px;
      left: 18px;
      right: 18px;
      transform: none;

      flex-wrap: wrap;
      justify-content: center;

      gap: 14px 18px;

      padding: 12px 16px;

      border-radius: 18px;

      background: rgba(0, 55, 90, 0.28);

      backdrop-filter: blur(8px);
    }

    .nav-link {
      font-size: 13px;
    }
  }

  /* TÉLÉPHONE */
  @media (max-width: 600px) {

    .hero {
      min-height: 100svh;

      background-image: url("vitrine-mobile.png");
      background-size: cover;
      background-position: center top;
    }
    .menu-toggle {
  display: none;
}

@media (max-width: 600px) {

  .menu-toggle {
    display: block;

    position: absolute;
    top: 18px;
    right: 18px;

    z-index: 20;

    width: 48px;
    height: 48px;

    border: 1px solid rgba(255,255,255,0.85);
    border-radius: 50%;

    background: rgba(0, 70, 120, 0.45);

    color: white;
    font-size: 26px;
    font-weight: bold;

    backdrop-filter: blur(8px);

    cursor: pointer;
  }

  .top-nav {
    display: none;

    position: absolute;
    top: 78px;
    left: 18px;
    right: 18px;

    transform: none;

    flex-direction: column;
    align-items: stretch;

    gap: 8px;

    padding: 18px;

    border-radius: 20px;

    background: rgba(0, 55, 95, 0.92);

    backdrop-filter: blur(12px);

    z-index: 19;
  }

  .top-nav.open {
    display: flex;
  }

  .nav-link,
  .discover-btn {
    width: 100%;

    text-align: center;

    padding: 12px 14px;

    font-size: 15px;
  }

  .nav-link::after {
    display: none;
  }
}

    .top-nav {
      display: none;
    }
  }
</style>
</head>

<body>

  <section class="hero">
<h1 class="seo-title">
  Béni Saf – Ville, plages, tourisme, histoire et patrimoine en Algérie
</h1>
    <picture>
      <source media="(max-width: 600px)" srcset="vitrine-mobile.png">
      <source media="(max-width: 1100px)" srcset="vitrine-tablette.png">

      <img
        src="vitrine.png"
        alt="Béni Saf en Algérie - ville côtière, plages, port et patrimoine"
        class="hero-img"
      >
    </picture>
<button class="menu-toggle" aria-label="Ouvrir le menu">
  ☰
</button>
    <nav class="top-nav">

      <a href="index.html" class="nav-link active">
        Accueil
      </a>

      <a href="photos.html" class="nav-link">
        Photos
      </a>

      <a href="videos.html" class="nav-link">
        Vidéos
      </a>

      <a href="bons-plans.html" class="nav-link">
        Bons plans
      </a>

      <a href="lieux.html" class="nav-link">
        Lieux à visiter
      </a>

      <a href="hebergements.html" class="nav-link">
        Hébergements
      </a>

      <a href="contact.html" class="nav-link">

      </a>

      <a href="plages.html" class="discover-btn">
  <span class="discover-icon">⌖</span>
  Découvrir les plages
</a>

    </nav>

  </section>
<script>
  const menuToggle = document.querySelector('.menu-toggle');
  const topNav = document.querySelector('.top-nav');

  menuToggle.addEventListener('click', () => {
    topNav.classList.toggle('open');
  });
</script>

  <!-- SAKKSI - AGENT VIRTUEL -->

<div class="sakksi-widget">

  <div class="sakksi-hint" id="sakksiHint">
    Besoin d'aide ? Demandez à SAKKSI
  </div>

  <div class="sakksi-chat" id="sakksiChat">

  <div class="sakksi-header">

    <div class="sakksi-title">
      <strong>SAKKSI • ASSISTANTE IA</strong>
    </div>

    <button
      class="sakksi-close"
      id="sakksiClose"
      aria-label="Fermer SAKKSI">
      ×
    </button>

  </div>

  <div class="sakksi-content">

    <div class="sakksi-message">
      <p>
        Bonjour, je suis <strong>SAKKSI</strong>.<br>
        Comment puis-je vous aider aujourd’hui ?
      </p>
    </div>

    <div class="sakksi-input-row">

      <input
        type="text"
        id="sakksiInput"
        class="sakksi-input"
        placeholder="Posez votre question..."
        autocomplete="off"
      >

      <button
        id="sakksiSend"
        class="sakksi-send"
        aria-label="Envoyer">
        ➤
      </button>

    </div>

  </div>

</div>


  <div class="sakksi-avatar-wrap" id="sakksiBubble">

  <div class="sakksi-glow"></div>

  <img
    src="sakksi.png"
    alt="SAKKSI - Assistante virtuelle de Béni Saf"
    class="sakksi-avatar">

</div>

</div>


<script>

const sakksiBubble =
  document.getElementById("sakksiBubble");

const sakksiChat =
  document.getElementById("sakksiChat");

const sakksiClose =
  document.getElementById("sakksiClose");

const sakksiHint =
  document.getElementById("sakksiHint");


sakksiBubble.addEventListener(
  "click",
  function(){

    sakksiChat.classList.toggle("open");

    if(
      sakksiChat.classList.contains("open")
    ){
      sakksiHint.style.opacity="0";
    }

  }
);


sakksiClose.addEventListener(
  "click",
  function(){

    sakksiChat.classList.remove("open");

    sakksiHint.style.opacity="1";

  }
);

</script>
</body>
