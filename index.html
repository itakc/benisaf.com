<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Béni Saf - Perle de la côte algérienne</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #0c5f92;
      overflow-x: hidden;
    }

    .hero {

  position: relative;
  width: 100%;
  min-height: 100vh;

  background-image: url("vitrine.png");

  background-size: 100% auto;
  background-position: center top;
  background-repeat: no-repeat;

}

    .top-nav {
      position: absolute;
      top: 18px;
      right: 4%;

      display: flex;
      align-items: center;
      gap: 32px;

      z-index: 10;
      filter: drop-shadow(0 3px 8px rgba(0,0,0,0.4));
    }

    .nav-link {
  position: relative;

  color: white;
  text-decoration: none;

  font-size: 16px;
  font-weight: 700;

  letter-spacing: 0.5px;

  text-shadow:
    0 2px 6px rgba(0,0,0,0.5);

  transition: all 0.3s ease;
}

    .nav-link::after {
      content: "";
      position: absolute;

      left: 0;
      bottom: -8px;

      width: 0;
      height: 2px;

      background: white;

      transition: width 0.25s ease;
    }

    .nav-link:hover::after,
    .nav-link.active::after {
      width: 100%;
    }

    .nav-link:hover {

  transform: translateY(-3px);

  color: #ffffff;

  text-shadow:
    0 0 10px rgba(255,255,255,0.9),
    0 0 20px rgba(255,255,255,0.5);
}

    .discover-btn {
      display: inline-flex;
      align-items: center;
      gap: 9px;

      padding: 13px 24px;

      color: white;
      text-decoration: none;

      font-size: 15px;
      font-weight: 700;

      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 999px;

      background: rgba(0, 85, 140, 0.18);

      backdrop-filter: blur(5px);

      transition:
        background 0.25s ease,
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }

    .discover-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);

      box-shadow:
        0 0 16px rgba(255, 255, 255, 0.18);
    }

    .discover-icon {
      font-size: 16px;
    }

    @media (max-width: 1100px) {
      .top-nav {
        gap: 18px;
        right: 3%;
      }

      .nav-link {
        font-size: 14px;
      }

      .discover-btn {
        padding: 11px 18px;
        font-size: 14px;
      }
    }

    @media (max-width: 850px) {
      .top-nav {
        top: 20px;
        left: 20px;
        right: 20px;

        flex-wrap: wrap;
        justify-content: center;

        gap: 14px 20px;

        padding: 12px 16px;

        border-radius: 18px;

        background: rgba(0, 55, 90, 0.28);

        backdrop-filter: blur(8px);
      }

      .nav-link {
        font-size: 13px;
      }
    }

    @media (max-width: 600px) {
      .hero {
        min-height: 100svh;
        background-position: center top;
      }

      .top-nav {
        gap: 12px 16px;
      }

      .nav-link {
        font-size: 12px;
      }

      .discover-btn {
        padding: 10px 16px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <section class="hero">

    <nav class="top-nav">

      <a href="index.html" class="nav-link active">
        Accueil
      </a>

      <a href="photos.html" class="nav-link">
        Photos
      </a>

      <a href="videos.html" class="nav-link">
        Vidéos
      </a>

      <a href="bons-plans.html" class="nav-link">
        Bons plans
      </a>

      <a href="lieux.html" class="nav-link">
        Lieux à visiter
      </a>

      <a href="hebergements.html" class="nav-link">
        Hébergements
      </a>

      <a href="contact.html" class="nav-link">
        Contact
      </a>

      <a href="decouvrir.html" class="discover-btn">
        <span class="discover-icon">⌖</span>
        Découvrir
      </a>

    </nav>

  </section>

</body>
</html>
