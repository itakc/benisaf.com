<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Béni Saf - Perle de la côte algérienne</title>

  <style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
  }

  html,
  body {
    width: 100%;
    min-height: 100%;
    background: #0c5f92;
    overflow-x: hidden;
  }

  .hero {
  position: relative;
  width: 100%;
}

.hero-img {
  display: block;
  width: 100%;
  height: auto;
}

  .top-nav {
    position: absolute;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);

    display: flex;
    align-items: center;
    gap: 28px;

    z-index: 10;

    white-space: nowrap;
  }

  .nav-link {
    position: relative;

    color: white;
    text-decoration: none;

    font-size: 16px;
    font-weight: 700;

    letter-spacing: 0.5px;

    text-shadow:
      0 2px 6px rgba(0, 0, 0, 0.55);

    transition:
      transform 0.25s ease,
      text-shadow 0.25s ease;
  }

  .nav-link::after {
    content: "";
    position: absolute;

    left: 0;
    bottom: -8px;

    width: 0;
    height: 2px;

    background: white;

    transition: width 0.25s ease;
  }

  .nav-link:hover::after,
  .nav-link.active::after {
    width: 100%;
  }

  .nav-link:hover {
    transform: translateY(-3px);

    text-shadow:
      0 0 10px rgba(255, 255, 255, 0.9),
      0 0 20px rgba(255, 255, 255, 0.5);
  }

  .discover-btn {
    display: inline-flex;
    align-items: center;
    gap: 9px;

    padding: 13px 24px;

    color: white;
    text-decoration: none;

    font-size: 15px;
    font-weight: 700;

    border: 1px solid rgba(255, 255, 255, 0.9);
    border-radius: 999px;

    background: rgba(0, 85, 140, 0.18);

    backdrop-filter: blur(5px);

    box-shadow:
      0 0 12px rgba(255, 255, 255, 0.16);

    transition:
      background 0.25s ease,
      transform 0.25s ease,
      box-shadow 0.25s ease;
  }

  .discover-btn:hover {
    background: rgba(255, 255, 255, 0.18);

    transform: translateY(-3px) scale(1.03);

    box-shadow:
      0 0 20px rgba(255, 255, 255, 0.45);
  }

  .discover-icon {
    font-size: 16px;
  }

  /* TABLETTE */
  @media (max-width: 1100px) {

    .hero {
      background-image: url("vitrine-tablette.png");
      background-position: center top;
    }

    .top-nav {
      gap: 18px;
    }

    .nav-link {
      font-size: 14px;
    }

    .discover-btn {
      padding: 11px 18px;
      font-size: 14px;
    }
  }

  /* TABLETTE / PETIT ÉCRAN */
  @media (max-width: 850px) {

    .top-nav {
      top: 18px;
      left: 18px;
      right: 18px;
      transform: none;

      flex-wrap: wrap;
      justify-content: center;

      gap: 14px 18px;

      padding: 12px 16px;

      border-radius: 18px;

      background: rgba(0, 55, 90, 0.28);

      backdrop-filter: blur(8px);
    }

    .nav-link {
      font-size: 13px;
    }
  }

  /* TÉLÉPHONE */
  @media (max-width: 600px) {

    .hero {
      min-height: 100svh;

      background-image: url("vitrine-mobile.png");
      background-size: cover;
      background-position: center top;
    }
    .menu-toggle {
  display: none;
}

@media (max-width: 600px) {

  .menu-toggle {
    display: block;

    position: absolute;
    top: 18px;
    right: 18px;

    z-index: 20;

    width: 48px;
    height: 48px;

    border: 1px solid rgba(255,255,255,0.85);
    border-radius: 50%;

    background: rgba(0, 70, 120, 0.45);

    color: white;
    font-size: 26px;
    font-weight: bold;

    backdrop-filter: blur(8px);

    cursor: pointer;
  }

  .top-nav {
    display: none;

    position: absolute;
    top: 78px;
    left: 18px;
    right: 18px;

    transform: none;

    flex-direction: column;
    align-items: stretch;

    gap: 8px;

    padding: 18px;

    border-radius: 20px;

    background: rgba(0, 55, 95, 0.92);

    backdrop-filter: blur(12px);

    z-index: 19;
  }

  .top-nav.open {
    display: flex;
  }

  .nav-link,
  .discover-btn {
    width: 100%;

    text-align: center;

    padding: 12px 14px;

    font-size: 15px;
  }

  .nav-link::after {
    display: none;
  }
}

    .top-nav {
      display: none;
    }
  }
</style>
</head>

<body>

  <section class="hero">

    <picture>
      <source media="(max-width: 600px)" srcset="vitrine-mobile.png">
      <source media="(max-width: 1100px)" srcset="vitrine-tablette.png">

      <img
        src="vitrine.png"
        alt="Béni Saf - Perle de la côte algérienne"
        class="hero-img"
      >
    </picture>
<button class="menu-toggle" aria-label="Ouvrir le menu">
  ☰
</button>
    <nav class="top-nav">

      <a href="index.html" class="nav-link active">
        Accueil
      </a>

      <a href="photos.html" class="nav-link">
        Photos
      </a>

      <a href="videos.html" class="nav-link">
        Vidéos
      </a>

      <a href="bons-plans.html" class="nav-link">
        Bons plans
      </a>

      <a href="lieux.html" class="nav-link">
        Lieux à visiter
      </a>

      <a href="hebergements.html" class="nav-link">
        Hébergements
      </a>

      <a href="contact.html" class="nav-link">
        Contact
      </a>

      <a href="decouvrir.html" class="discover-btn">
        <span class="discover-icon">⌖</span>
        Découvrir
      </a>

    </nav>

  </section>
<script>
  const menuToggle = document.querySelector('.menu-toggle');
  const topNav = document.querySelector('.top-nav');

  menuToggle.addEventListener('click', () => {
    topNav.classList.toggle('open');
  });
</script>
</body>
</html>
