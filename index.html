 <title>Béni Saf – Ville, plages, tourisme et histoire | benisaf.fr</title>

  <style>
  * {
    margin: 0;
    padding: 0;

    font-family: Arial, Helvetica, sans-serif;
  }

  html,
  body {
    width: 100%;
    min-height: 100%;
    background: #0c5f92;
    overflow-x: hidden;
  }

  .hero {

  width: 100%;
}

.hero-img {
  display: block;
  width: 100%;
  height: auto;
}

  .top-nav {
  position: absolute;
  top: 42px;

  left: 280px;
  right: 40px;

  display: flex;
  align-items: center;
  gap: 28px;

  z-index: 10;

  white-space: nowrap;
}

  .nav-link {
    position: relative;

    color: white;
    text-decoration: none;

    font-size: 16px;
    font-weight: 700;

    letter-spacing: 0.5px;

    text-shadow:
      0 2px 6px rgba(0, 0, 0, 0.55);

    transition:
      transform 0.25s ease,
      text-shadow 0.25s ease;
  }

  .nav-link::after {
    content: "";
    position: absolute;

    left: 0;
    bottom: -8px;

    width: 0;
    height: 2px;

    background: white;

    transition: width 0.25s ease;
  }

  .nav-link:hover::after,
  .nav-link.active::after {
    width: 100%;
  }

  .nav-link:hover {
    transform: translateY(-3px);

    text-shadow:
      0 0 10px rgba(255, 255, 255, 0.9),
      0 0 20px rgba(255, 255, 255, 0.5);
  }

  .discover-btn {
    display: inline-flex;
    align-items: center;
    gap: 9px;

    padding: 13px 24px;

    color: white;
    text-decoration: none;

    font-size: 15px;
    font-weight: 700;

    border: 1px solid rgba(255, 255, 255, 0.9);
    border-radius: 999px;

    background: rgba(0, 85, 140, 0.18);

    backdrop-filter: blur(5px);

    box-shadow:
      0 0 12px rgba(255, 255, 255, 0.16);

    transition:
      background 0.25s ease,
      transform 0.25s ease,
      box-shadow 0.25s ease;
  }

  .discover-btn:hover {
    background: rgba(255, 255, 255, 0.18);

    transform: translateY(-3px) scale(1.03);

    box-shadow:
      0 0 20px rgba(255, 255, 255, 0.45);
  }

  .discover-icon {
    font-size: 16px;
  }
    .seo-title{
  position:absolute;
  width:1px;
  height:1px;
  padding:0;
  margin:-1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap;
  border:0;
}

/* ========================= */
/* SAKKSI - AGENT VIRTUEL    */
/* ========================= */

.sakksi-widget{
  position:fixed;
  right:24px;
  bottom:8px;
  z-index:9999;
  font-family:Arial, Helvetica, sans-serif;
}


/* ASSISTANTE HOLOGRAPHIQUE */

.sakksi-avatar-wrap{
  position:relative;

  width:145px;
  height:245px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;

  cursor:pointer;

  transition:
    transform .3s ease,
    filter .3s ease;
}

.sakksi-avatar-wrap:hover{
  transform:translateY(-4px) scale(1.03);
}

.sakksi-avatar{
  display:block;

  width:auto !important;
  height:auto !important;

  max-width:145px !important;
  max-height:210px !important;

  object-fit:contain;

  filter:
    drop-shadow(0 0 8px rgba(0,220,255,.78))
    drop-shadow(0 0 22px rgba(0,150,255,.55));
}


/* HALO AU SOL */

.sakksi-glow{
  position:absolute;

  left:50%;
  bottom:20px;

  width:115px;
  height:20px;

  transform:translateX(-50%);

  border-radius:50%;

  background:rgba(0,220,255,.28);

  filter:blur(12px);

  z-index:-1;
}


/* PETIT TEXTE SOUS SAKKSI */

.sakksi-mini-label{
  position:relative;
  z-index:2;

  margin-top:2px;

  font-size:12px;
  font-weight:700;

  color:rgba(230,250,255,.95);

  letter-spacing:.4px;

  text-align:center;

  white-space:nowrap;

  text-shadow:
    0 0 5px rgba(0,190,255,.55),
    0 0 10px rgba(0,160,255,.28);
}


/* ========================= */
/* FENETRE SAKKSI            */
/* ========================= */

.sakksi-chat{
  position:absolute;

  right:158px;
  bottom:10px;

  width:340px;

  border-radius:22px;

  overflow:hidden;

  background:
    linear-gradient(
      145deg,
      rgba(12,72,120,.30),
      rgba(3,34,70,.24)
    );

  border:
    1px solid rgba(100,230,255,.30);

  box-shadow:
    0 0 16px rgba(0,220,255,.18),
    0 0 38px rgba(0,150,255,.10),
    0 16px 40px rgba(0,0,0,.28),
    inset 0 0 22px rgba(80,220,255,.04);

  backdrop-filter:
    blur(16px)
    saturate(160%);

  -webkit-backdrop-filter:
    blur(16px)
    saturate(160%);

  opacity:0;
  visibility:hidden;

  transform:
    translateX(16px)
    scale(.96);

  transform-origin:
    bottom right;

  transition:
    opacity .3s ease,
    visibility .3s ease,
    transform .3s ease;
}

.sakksi-chat.open{
  opacity:1;
  visibility:visible;

  transform:
    translateX(0)
    scale(1);
}


/* HEADER */

.sakksi-header{
  display:flex;
  align-items:center;

  padding:13px 16px;

  border-bottom:
    1px solid rgba(100,210,255,.14);

  background:
    linear-gradient(
      90deg,
      rgba(12,74,135,.18),
      rgba(0,180,230,.06)
    );
}

.sakksi-title{
  flex:1;
}

.sakksi-title strong{
  display:block;

  color:#73edff;

  font-size:16px;
  font-weight:800;

  letter-spacing:1px;

  text-shadow:
    0 0 10px rgba(0,220,255,.22);
}

.sakksi-close{
  width:30px;
  height:30px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:0;
  border-radius:50%;

  background:transparent;

  color:#e5fbff;

  font-size:23px;

  cursor:pointer;

  transition:.2s ease;
}

.sakksi-close:hover{
  background:rgba(255,255,255,.07);
  transform:rotate(90deg);
}


/* CONTENU */

.sakksi-content{
  padding:13px 15px 15px;
}


/* MESSAGE */

.sakksi-message{
  padding:14px 16px;

  margin-bottom:13px;

  border-radius:16px;

  background:
    linear-gradient(
      145deg,
      rgba(30,105,170,.08),
      rgba(5,48,100,.10)
    );

  border:
    1px solid rgba(95,215,255,.18);

  box-shadow:
    inset 0 0 18px rgba(60,190,255,.03);
}

.sakksi-message p{
  margin:0;

  color:#f6fcff;

  font-size:15px;

  line-height:1.45;
}

.sakksi-message strong{
  color:white;
}


/* CHAMP DE SAISIE */

.sakksi-input-row{
  display:flex;
  align-items:center;

  gap:8px;

  width:100%;
}

.sakksi-input{
  flex:1;

  min-width:0;

  height:46px;

  padding:0 14px;

  border-radius:14px;

  border:
    1px solid rgba(80,205,255,.22);

  outline:none;

  background:
    rgba(2,29,61,.34);

  color:white;

  font-family:Arial, Helvetica, sans-serif;

  font-size:14px;

  box-shadow:
    inset 0 0 14px rgba(0,0,0,.12);
}

.sakksi-input::placeholder{
  color:
    rgba(205,230,245,.52);
}

.sakksi-input:focus{
  border-color:
    rgba(75,225,255,.62);

  box-shadow:
    0 0 12px rgba(0,190,255,.14),
    inset 0 0 14px rgba(0,0,0,.12);
}


/* BOUTON ENVOI */

.sakksi-send{
  flex:0 0 48px;

  width:48px;
  height:46px;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:0;

  border:0;

  border-radius:14px;

  background:
    linear-gradient(
      145deg,
      rgba(53,195,255,.90),
      rgba(10,166,233,.90)
    );

  color:white;

  font-size:22px;

  cursor:pointer;

  box-shadow:
    0 0 18px rgba(0,190,255,.24);

  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.sakksi-send:hover{
  transform:
    translateY(-2px)
    scale(1.03);

  box-shadow:
    0 0 24px rgba(0,205,255,.40);
}


/* MOBILE */

@media(max-width:600px){

  .sakksi-widget{
    right:10px;
    bottom:5px;
  }

  .sakksi-avatar-wrap{
    width:100px;
    height:175px;
  }

  .sakksi-avatar{
    max-width:100px !important;
    max-height:150px !important;
  }

  .sakksi-mini-label{
    font-size:10px;
  }

  .sakksi-glow{
    bottom:18px;
    width:85px;
  }

  .sakksi-chat{
    position:fixed;

    left:12px;
    right:12px;
    bottom:175px;

    width:auto;

    border-radius:20px;
  }

  .sakksi-header{
    padding:12px 14px;
  }

  .sakksi-title strong{
    font-size:14px;
  }

  .sakksi-content{
    padding:12px;
  }

  .sakksi-message{
    padding:13px;
  }

  .sakksi-message p{
    font-size:14px;
  }

  .sakksi-input{
    height:44px;
    font-size:14px;
  }

  .sakksi-send{
    width:46px;
    height:44px;
    flex-basis:46px;
  }
}


  /* TABLETTE */
  @media (max-width: 1100px) {

    .hero {
      background-image: url("vitrine-tablette.png");
      background-position: center top;
    }

    .top-nav {
      gap: 18px;
    }

    .nav-link {
      font-size: 14px;
    }

    .discover-btn {
      padding: 11px 18px;
      font-size: 14px;
    }
  }

  /* TABLETTE / PETIT ÉCRAN */
  @media (max-width: 850px) {

    .top-nav {
      top: 18px;
      left: 18px;
      right: 18px;
      transform: none;

      flex-wrap: wrap;
      justify-content: center;

      gap: 14px 18px;

      padding: 12px 16px;

      border-radius: 18px;

      background: rgba(0, 55, 90, 0.28);

      backdrop-filter: blur(8px);
    }

    .nav-link {
      font-size: 13px;
    }
  }

  /* TÉLÉPHONE */
  @media (max-width: 600px) {

    .hero {
      min-height: 100svh;

      background-image: url("vitrine-mobile.png");
      background-size: cover;
      background-position: center top;
    }
    .menu-toggle {
  display: none;
}

@media (max-width: 600px) {

  .menu-toggle {
    display: block;

    position: absolute;
    top: 18px;
    right: 18px;

    z-index: 20;

    width: 48px;
    height: 48px;

    border: 1px solid rgba(255,255,255,0.85);
    border-radius: 50%;

    background: rgba(0, 70, 120, 0.45);

    font-size: 26px;
    font-weight: bold;

    backdrop-filter: blur(8px);

  }

  .top-nav {

    flex-direction: column;

    gap: 8px;

    padding: 18px;

    border-radius: 20px;

    background: rgba(0, 55, 95, 0.92);

    backdrop-filter: blur(12px);

    z-index: 19;
  }

  .top-nav.open {
    display: flex;
  }

  .nav-link,
  .discover-btn {
    width: 100%;

    text-align: center;

    padding: 12px 14px;

    font-size: 15px;
  }

  .nav-link::after {
    display: none;
  }
}

    .top-nav {
      display: none;
    }
  }
</style>
</head>

<body>

  <section class="hero">
<h1 class="seo-title">
  Béni Saf – Ville, plages, tourisme, histoire et patrimoine en Algérie
</h1>
    <picture>
      <source media="(max-width: 600px)" srcset="vitrine-mobile.png">
      <source media="(max-width: 1100px)" srcset="vitrine-tablette.png">

      <img
        src="vitrine.png"
        alt="Béni Saf en Algérie - ville côtière, plages, port et patrimoine"
        class="hero-img"
      >
    </picture>
<button class="menu-toggle" aria-label="Ouvrir le menu">
  ☰
</button>
    <nav class="top-nav">

      <a href="index.html" class="nav-link active">
        Accueil
      </a>

      <a href="bons-plans.html" class="nav-link">
        Vivre à Béni Saf
      </a>

      <a href="lieux.html" class="nav-link">
        La plage du puits
      </a>

      <a href="hebergements.html" class="nav-link">
        Hébergements
      </a>

      <a href="photos.html" class="nav-link">
        Photos
      </a>

      <a href="videos.html" class="nav-link">
        Vidéos
      </a>

      <a href="contact.html" class="nav-link">
        Contact
      </a>

      <a href="plages.html" class="discover-btn">
  <span class="discover-icon">⌖</span>
  Découvrir les plages
</a>

    </nav>

  </section>
<script>
  const menuToggle = document.querySelector('.menu-toggle');
  const topNav = document.querySelector('.top-nav');

  menuToggle.addEventListener('click', () => {
    topNav.classList.toggle('open');
  });
</script>

 <!-- SAKKSI - AGENT VIRTUEL -->

<div class="sakksi-widget">

  <div class="sakksi-chat" id="sakksiChat">

    <div class="sakksi-header">

      <div class="sakksi-title">
        <strong>SAKKSI • ASSISTANTE IA</strong>
      </div>

      <button
        class="sakksi-close"
        id="sakksiClose"
        aria-label="Fermer SAKKSI">
        ×
      </button>

    </div>


    <div class="sakksi-content">

      <div class="sakksi-message">
        <p>
          Bonjour, je suis <strong>SAKKSI</strong>.<br>
          Comment puis-je vous aider aujourd’hui ?
        </p>
      </div>


      <div class="sakksi-input-row">

        <input
          type="text"
          id="sakksiInput"
          class="sakksi-input"
          placeholder="Posez votre question..."
          autocomplete="off"
        >

        <button
          id="sakksiSend"
          class="sakksi-send"
          aria-label="Envoyer">
          ➤
        </button>

      </div>

    </div>

  </div>


  <div
    class="sakksi-avatar-wrap"
    id="sakksiBubble"
    role="button"
    tabindex="0"
    aria-label="Ouvrir SAKKSI">

    <div class="sakksi-glow"></div>

    <img
      src="sakksi.png"
      alt="SAKKSI - Assistante virtuelle de Béni Saf"
      class="sakksi-avatar">

    <div class="sakksi-mini-label">
      Demander SAKKSI
    </div>

  </div>

</div>

<script>

const sakksiBubble =
  document.getElementById("sakksiBubble");

const sakksiChat =
  document.getElementById("sakksiChat");

const sakksiClose =
  document.getElementById("sakksiClose");


function toggleSakksi(){

  sakksiChat.classList.toggle("open");

}


sakksiBubble.addEventListener(
  "click",
  toggleSakksi
);


sakksiBubble.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" ||
      event.key === " "
    ){
      event.preventDefault();
      toggleSakksi();
    }

  }
);


sakksiClose.addEventListener(
  "click",
  function(event){

    event.stopPropagation();

    sakksiChat.classList.remove("open");

  }
);

</script>
</body>
